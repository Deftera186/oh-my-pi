// omp default keybindings — pi parity (packages/coding-agent/src/config/keybindings.ts).
// ADR 0014: the default bindings are a cfg file of `bind` lines, executed
// before ~/.o2/config.cfg so any user `bind`/`unbind` overrides them.
//
// Editor keys (cursor, word motion, kill/yank, undo, newline, autocomplete
// tab, ctrl+. spelling) live in the editor's own keymap and are not binds.

// app.interrupt / app.clear / app.exit / app.suspend / app.display.reset
bind escape        cl_interrupt
bind ctrl+c        cl_clear
bind ctrl+d        cl_exit
bind ctrl+z        cl_suspend
bind alt+l         cl_display_reset

// app.thinking.cycle / app.thinking.toggle
bind shift+tab     cl_thinking_cycle
bind ctrl+t        "toggle cl_showthinking"

// app.model.cycleForward / cycleBackward / select / selectTemporary
bind ctrl+p        cl_model_cycle
bind ctrl+shift+p  "cl_model_cycle back"
bind alt+m         cl_model_select
bind alt+p         "cl_model_select session"

// app.tools.expand / app.tools.toggleVisibility
bind ctrl+o        "toggle cl_tools_expanded"
bind ctrl+shift+o  "toggle cl_showtools"

// app.editor.external
bind ctrl+g        cl_editor_external

// app.message.followUp — ctrl+enter is the editor's newline chord in omp
// (crates/tui keymap); alt+enter is the follow-up spelling every terminal
// delivers.
bind ctrl+q        cl_followup
bind alt+enter     cl_followup

// app.retry
bind f5            cl_retry
bind alt+r         cl_retry

// app.message.dequeue — alt+up and shift+up decode to one chord (macOS
// Terminal.app eats Option+Up); the kernel hands undelivered steering back
// (Up::Unqueue) and queued prompts come from <queues><prompts>.
bind alt+up        cl_dequeue

// app.clipboard.pasteImage / pasteTextRaw / copyLine / copyPrompt
bind ctrl+v        cl_paste_image
bind ctrl+shift+v  cl_paste_raw
bind alt+shift+l   cl_copy_line
bind alt+shift+c   cl_copy_prompt

// app.agents.hub / app.session.observe
bind alt+a         agents
bind ctrl+s        hub

// app.plan.toggle
bind alt+shift+p   cl_plan_toggle

// app.history.search
bind ctrl+r        cl_history_search

// app.live.toggle (app.stt.toggle has no default chord in pi; the space-hold
// gesture is the push-to-talk entry point)
bind ctrl+l        live
