[package]
name = "omp-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = [
	"Can Bölük",
	"Stencil Labs, Inc.",
]
homepage.workspace = true
repository.workspace = true
description = "Cross-platform audio capture, playback, metering, and ownership coordination for OMP voice features"
readme = "README.md"

[features]
default = ["native-audio"]
native-audio = ["dep:libc", "dep:windows-sys"]
realtime-media = ["dep:audiopus_sys", "dep:bytes",  "dep:opus", "dep:webrtc"]
realtime-transport = ["realtime-media", "device-attestation", "dep:futures", "dep:http", "dep:serde", "dep:serde_json", "dep:tokio-tungstenite", "dep:url"]
device-attestation = ["dep:block2", "dep:objc2", "dep:objc2-foundation"]

[lints]
workspace = true

[dependencies]
futures = { workspace = true, optional = true }
flume.workspace = true
http = { workspace = true, optional = true }
omp-core.workspace = true
parking_lot.workspace = true
regex.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
strum.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-tungstenite = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, optional = true }
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
audiopus_sys = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
opus = { workspace = true, optional = true }
webrtc = { workspace = true, optional = true }
