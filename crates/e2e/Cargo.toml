[package]
name = "omp-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Executable cross-crate acceptance proofs for the OMP agent mesh"
readme = "README.md"
publish = false

[[bin]]
name = "baseline"
path = "src/bin/baseline.rs"
test = false


[[bin]]
name = "pooling-bench"
path = "src/bin/pooling_bench.rs"
test = false

[[bin]]
name = "pooling-runner"
path = "src/bin/pooling_runner.rs"
test = false

[[bin]]
name = "omp_e2e_host"
path = "src/bin/omp_e2e_host.rs"
test = false

[dependencies]
async-stream = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }
omp-agent = { workspace = true }
omp-app = { workspace = true }
omp-core = { workspace = true }
omp-docserver = { workspace = true }
omp-env = { workspace = true }
omp-envd = { workspace = true }
omp-ext = { workspace = true }
omp-hashline = { workspace = true }
omp-catalog = { workspace = true }
omp-inference = { workspace = true, features = ["test-support"] }
omp-proto = { workspace = true }
omp-rpc = { workspace = true }
omp-serve = { workspace = true }
omp-shell = { workspace = true }
omp-shell-engine = { workspace = true }
omp-storage = { workspace = true }
omp-telemetry = { workspace = true }
omp-tool = { workspace = true }
omp-tools = { workspace = true }
omp-tui = { workspace = true }
parking_lot = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
xutf = { workspace = true }

[lints]
workspace = true
